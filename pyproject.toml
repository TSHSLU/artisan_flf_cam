[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artisancam"
version = "0.1.0"
description = "Minimal text-to-G-code engraver for the Snapmaker Artisan"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.12", "tomlkit>=0.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artisancam = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
